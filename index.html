<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aidyn :)</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <form id="form">
        <label for="username"> Username: </label> <br>
        <input type="text" id="username" name="username" required> <br>
        <label for="birthYear"> Birth Year: </label> <br>
        <input type="number" id="birthYear" name="birthYear" step="1" required> <br>

        <button> Create / Update profile </button>
    </form>

    <label> My tasks: </label>
    <ul id="tasks">
        <li> cleaning </li>
        <li> studying </li>
        <li> sleeping </li>
    </ul>

    <input type="text" id="addNewItem"> <br>

    <button id="add"> Add Item </button>
    <button id="remove"> Remove last item </button>


    <script src="script.js"></script>
</body>
</html>
